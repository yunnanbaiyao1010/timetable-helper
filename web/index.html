<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课表助手">
<title>课表助手 · 孙维</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">课表助手</span>
      </div>
      <div class="topbar-acts">
        <button class="icon-btn" data-act="scan" aria-label="识图加日程">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l.9-1.3a1.5 1.5 0 0 1 1.24-.7h4.32a1.5 1.5 0 0 1 1.24.7l.9 1.3h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"></path>
            <circle cx="12" cy="12.5" r="3.2"></circle>
          </svg>
        </button>
        <button class="icon-btn" id="btnSettings" aria-label="设置">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="12" cy="12" r="3.2"></circle>
            <path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M18 6l-1.4 1.4M7.4 16.6L6 18"></path>
          </svg>
        </button>
      </div>
    </div>
    <div class="semester-line">
      <div class="week-badge" id="weekBadge">第 10 周</div>
      <div class="semester-meta" id="semesterMeta">2026-2027 学年 第 1 学期</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-labels">
        <span id="progressLeft">学期进度 62%</span>
        <span id="progressRight">还剩 6 周</span>
      </div>
    </div>
  </header>

  <main class="main">

    <section class="view is-active" id="viewToday" aria-label="今日">
      <div id="alertSlot"></div>
      <div id="heroSlot"></div>
      <div id="todayTimeline"></div>
      <div id="focusSlot"></div>
      <div id="todayTasks"></div>
    </section>

    <section class="view" id="viewWeek" aria-label="周表">
      <div class="week-head">
        <button class="round-btn" id="weekPrev" aria-label="上一周">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <div class="week-head-mid">
          <div class="week-head-title" id="weekTitle">第 10 周</div>
          <button class="link-btn" id="weekBack">回到本周</button>
        </div>
        <button class="round-btn" id="weekNext" aria-label="下一周">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
      <div class="week-summary" id="weekSummary"></div>
      <div class="grid-scroll">
        <div class="timetable" id="timetable"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="view" id="viewTasks" aria-label="待办">
      <div class="card add-card">
        <div class="card-title">添加待办</div>
        <input class="input" id="taskTitle" type="text" placeholder="要做什么？比如：Qt 实验报告">
        <div class="add-row">
          <select class="input select" id="taskCourse"></select>
          <input class="input" id="taskDue" type="date">
        </div>
        <button class="btn btn-primary" id="btnAddTask">加入清单</button>
      </div>
      <div id="taskList"></div>
    </section>

    <section class="view" id="viewStats" aria-label="统计">
      <div id="statsBody"></div>
    </section>

  </main>

  <nav class="tabbar" role="tablist">
    <button class="tab is-active" data-view="viewToday" role="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"></rect><path d="M3.5 9.5h17M8 3v4M16 3v4"></path></svg>
      <span>今日</span>
    </button>
    <button class="tab" data-view="viewWeek" role="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"></rect><path d="M3.5 9.5h17M9.2 9.5v11M14.8 9.5v11M3.5 14.5h17"></path></svg>
      <span>周表</span>
    </button>
    <button class="tab" data-view="viewTasks" role="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.2l2 2 3.4-3.4M4 16.2l2 2 3.4-3.4M12.5 7.5h7M12.5 16.5h7"></path></svg>
      <span>待办</span>
    </button>
    <button class="tab" data-view="viewStats" role="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 19.5V10M10 19.5V5M16 19.5v-6.5M22 19.5h-19"></path></svg>
      <span>统计</span>
    </button>
  </nav>

</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/native.js"></script>
<script src="js/ai-scan.js"></script>
<script src="js/scan-sheet.js"></script>
<script src="js/widget-bridge.js"></script>
</body>
</html>
